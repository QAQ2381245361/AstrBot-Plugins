name: astrbot_plugin_desire_owner
display_name: "暗涌 · 欲望归属"
short_desc: 欲望归谁管：只用鱼之心 / 分工（鱼之心九维 + 暗涌欲望）/ 两套都注入
desc: |-
  这是「暗涌」的总开关：开卡片 = 启动引擎 + 交给暗涌；关卡片 = 交还鱼之心 + 停引擎。

  **两种用法**
  - 默认（暗涌全权）：只用暗涌。请先把「鱼的心」卡片关掉，否则两边会同时注入
  - 分工：鱼之心管九维与主动联系，暗涌管欲望与成人层

  **两套不能同时全开**：同一件事会出现两种矛盾数值，所以不提供那个选项。
  不分工时，只启用一个——关掉另一张卡片即可。

  **只用鱼之心**：把这张「暗涌」卡片关掉，鱼之心就恢复成完整的自己。

  改完保存会重新加载本插件，开关立即写入 C:\DeepSeek\desire_switch.json，
  鱼之心和暗涌都在每轮对话读这一份文件。

  详细说明见本插件的「文档」。

version: 1.3.0
author: Nyakori/DeepSeek
