name: astrbot_plugin_conception
display_name: 子宫孕育
short_desc: 让她会怀孕：快感/高潮/内射掷骰，受孕状态写进日常提示词，孕期暂停生理期
desc: |
  给角色加一条"身体线"：快感值、高潮次数、受孕判定、验孕、十个月孕期。

  受孕概率不是凭空掷的，每一步都能在 /受孕状态 里看见：
    生理期基准概率（默认分布在 5% ~ 40%：排卵最高、月经最低）
    × 鱼之心「欲」（插件启用且已解锁时）
    × 暗涌 lust（归属给暗涌、引擎在跑时）
    × 快感值 × 高潮次数
    × 体内/体外，以及"高潮后短时间被体内射精"的额外加成

  快感与高潮是联动的：快感到阈值才算真高潮，高潮后回落并有短暂不应期；
  快感档位、刚高潮过的状态、够不够到高潮，都会换成她身体上的感觉写进提示词。

  子敏感度（1.9.0）：
    - 只在受孕活动（亲密场景）里生效的第二层条，面板上就在「敏感点」旁边；
    - 每个敏感点一条 0–100 的条，分三段（初起/发烫/将溢），每段一句提示词；
    - 碰一下涨一点（两三下就满），条满了给主敏感点加开发度/敏感度、额外补一笔快感，
      然后几秒内快速回落到 0；不在活动里不涨，也会很快掉回去。
    - 面板「敏感点阶段性表现设置」里可以逐部位改这三段提示词（留空 = 用内置默认）。
    - 每个部位还有「方式」：乳房 乳交/舔/吮吸、乳头 揉搓/舔/吮吸、外阴 逗弄/舔/吮吸、
      阴道 手指/生殖器/小玩具/舔/吮吸、G点 手指/生殖器/小玩具、子宫颈 生殖器/小玩具、
      肛 手指/生殖器/小玩具/舔/吮吸、嘴/喉咙 生殖器/舔/吮吸/舌、耳朵 舔耳、
      脚 生殖器/舔/吮吸、尾巴 抚摸/揉捏玩弄/舔/吮吸；每个方式一句提示词，和段位那句拼成完整描述。
      方式由模型调 intimacy_touch 时传 method（中文/英文都行），也能从对话关键词里猜；
      这些关键词在面板「敏感点阶段性表现设置 → 关键词」里可以逐条改（清空=这个方式不自动判断）。
    - 子敏感度的提示词**只在受孕活动（亲密场景）里注入**；场景一结束就不带了（进度本身还留着）。
      日常能用的玩具只有在"确实还用在身上"（toys.active_minutes 内）时才带玩具那句提示。
    - 日常小场景（1.13.0）：不在场景里用一下日常玩具，会开一个 toys.daily_minutes 分钟的小窗口：
      玩具把**对应部位**的子敏感度推高、提示词只带那一个部位，还可能直接把她弄到一次高潮；
      一旦发生真正的亲密动作（碰她/进入/内射），这个小场景会升级成正式的活动场景，
      子敏感度攒的进度原样保留。
    - 日常情绪（1.14.0）：欲望度 / 羞耻度两条数值，面板「日常情绪」卡片里能加减、能哄。
      每次激发小玩具两条都涨；欲望满了会转成正式场景，羞耻满了会加一点鱼之心的责怪并进
      一段羞耻期（这期间玩具不可用）；安慰/摸摸头/亲吻、正常聊天、时间都会降羞耻。
      两条各有 4 段提示词，可在设置页「日常情绪」里改。
    - 日常情绪**只在"正在用玩具那一小段"或"羞耻期"里写进提示词**；平常日子里一次玩具都没碰就不带。
    - 子宫（1.15.0）：容量可调、装多了会**短暂撑开**（比例/时长可调），有**充盈 4 段**提示词；
      装到阈值后再内射会**溢出来**（可开关，阈值可调），溢出的 3 段提示词也能自定义。
    - 魅魔尾巴（1.15.0）：独立开关；开着时就算「敏感点·尾巴」关着尾巴也能用，并按魅魔尾巴算敏感度。

  受孕后：
    - 预产期按十个月算，前后浮动几天；
    - 孕期状态写进日常提示词（system prompt），她知道自己在第几个月、预产期是哪天；
    - 她一开始还不知道，亲密之后有概率自己起念验孕（pregnancy_test），
      验出来要不要告诉主人、什么时候说，由她自己决定；
    - private_companion 的月经周期被置为 not_applicable（改的是它自己的
      cycle_clock 字段，带 revision 保护 + 原值备份 + 库备份），十个月内不再出现经期；
    - 到预产期自动收尾，周期锚点按暂停天数后移，从停下来的地方接着走。

  性别适配：先读当前人格的人设原文判断性别——男性 / 其他 / 非人类、或者关掉时
  整个插件不生效（不注入、工具拒绝、命令只做说明），不会硬套女性设定。

  数据只在本插件自己的 plugin_data 里；对别的插件只读（唯一的写操作是孕期暂停
  private_companion 的周期，可用配置关掉）。

  命令：/受孕状态 /受孕同意 /受孕关闭 /受孕测试 /受孕快感 /受孕高潮
        /受孕内射 /受孕体外 /受孕强制 /受孕重置 /受孕记录 /受孕帮助
  工具：intimacy_pleasure / intimacy_orgasm / intimacy_ejaculation /
        pregnancy_test / pregnancy_status
